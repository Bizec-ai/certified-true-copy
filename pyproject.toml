[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "certified-true-copy"
version = "0.1.0"
description = "Turn a scanned PDF into a certified true copy: strip blank pages, stamp, certify, lock read-only"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["pymupdf>=1.23"]

[project.scripts]
ctc = "ctc.cli:main"

[tool.setuptools]
packages = ["ctc"]
